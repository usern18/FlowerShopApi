
name: FlowerShopApi CD

on:
  push:
    branches:
      - develop
    paths:
      - 'FlowerShopApi/**'
      - 'frontend/**'
      - 'FlowerShopApi.Tests/**'
      - 'FlowerShopApi.ProductTests/**'
      - 'FlowerShopApi.sln'
      - '.github/workflows/cd.yml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore FlowerShopApi.sln

      - name: Build solution
        run: dotnet build FlowerShopApi.sln -c Release --no-restore

      - name: Run unit tests
        run: |
          dotnet test FlowerShopApi.Tests/FlowerShopApi.Tests.csproj -c Release --no-build
          dotnet test FlowerShopApi.ProductTests/FlowerShopApi.ProductTests.csproj -c Release --no-build

  publish:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./FlowerShopApi
          push: true
          tags: |
            gufshos/flowershopapi:latest
            gufshos/flowershopapi:${{ github.sha }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            gufshos/flowershop-frontend:latest
            gufshos/flowershop-frontend:${{ github.sha }}
