
name: FlowerShopApi CI

on:
  push:
    branches:
      - develop
      - deployment/module-4

  pull_request:
    branches:
      - develop
       - deployment/module-4

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test .NET
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore FlowerShopApi.sln

      - name: Build solution
        run: dotnet build FlowerShopApi.sln --configuration Release --no-restore

      - name: Run unit tests
        run: |
          dotnet test FlowerShopApi.Tests/FlowerShopApi.Tests.csproj --configuration Release --no-build
          dotnet test FlowerShopApi.ProductTests/FlowerShopApi.ProductTests.csproj --configuration Release --no-build
